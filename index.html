<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="theme-color" content="#2d3331" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <title>Paper.io 2</title>
        <meta
            name="description"
            content="In Paper.io 2 you fight other players for territory on a sheet of paper."
        />

        <link rel="manifest" href="manifest.json" />
        <link rel="icon" type="image/png" href="assets/images/icon512.png" />
        <!-- Installed app on a Mac: Safari's Add to Dock takes its icon and name from these. -->
        <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Paper.io 2" />
        <link rel="stylesheet" href="assets/fonts/ptsans.css" />
        <link rel="stylesheet" href="style3.css" />
        <link rel="stylesheet" href="joystick.css" />
        <!-- On a phone a long press on a menu button selected its label instead of pressing it. -->
        <style>
            button {
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }
        </style>
    </head>

    <body>
        <div id="game"></div>
        <div id="about">
            <div class="modal_box">
                <h1>Paper.io 2 online game</h1>
                <div class="modal_scroll">
                    <p>
                        Paper.io 2 is a sequel to what might be the most popular mobile game played by
                        people from all around the world.
                    </p>
                </div>
                <p>
                    <a href="#aboutclose" onclick="HideAbout();">Close window</a>
                </p>
            </div>
        </div>

        <script type="text/javascript">
            // Offline shim: the original page relied on an ad network (adinplay / gameads)
            // and analytics (gtag / Yandex.Metrika). Those are stripped here. The game only
            // needs window.ShowPreroll() to exist (app2.js calls it on "Play") and calls
            // window.paperio2api.startGame() to begin. We just start immediately.

            function ShowAbout() {
                var ab = document.getElementById('about');
                ab.style.display = ab.style.display === 'block' ? 'none' : 'block';
            }
            function HideAbout() {
                document.getElementById('about').style.display = 'none';
            }

            function StartGame() {
                HideAbout();
                window.paperio2api.startGame();
            }

            // Called by app2.js when the player presses Play. No ads offline -> start directly.
            window.ShowPreroll = function () {
                StartGame();
            };

            // Domain lock guard. On any host but paperio.site the engine, while its script is
            // still evaluating, arms setTimeout(() => location.replace('http://paper-io.com/?' +
            // host), (Math.PI + Math.random()) * 60000), which throws the player off the game 3-4
            // minutes in. location and its members cannot be patched, so the timer itself is
            // defused instead: it keeps its delay and its id, and only its callback becomes a
            // no-op. Both engines arm it the same way, so they stay identical to each other.
            (function () {
                var minDelay = Math.PI * 60000;
                var maxDelay = (Math.PI + 1) * 60000;
                var setTimeoutBefore = window.setTimeout;

                function isEngineScript(script) {
                    return !!script && /(?:^|\/)app2\.js(?:[?#]|$)/.test(script.src || '');
                }

                window.setTimeout = function (handler, delay) {
                    if (isEngineScript(document.currentScript) && delay >= minDelay && delay < maxDelay) {
                        window.paperio2domainLockDefused = (window.paperio2domainLockDefused || 0) + 1;
                        var args = Array.prototype.slice.call(arguments);
                        args[0] = function () {};
                        return setTimeoutBefore.apply(this, args);
                    }
                    return setTimeoutBefore.apply(this, arguments);
                };
            })();

            // The lock's second half. Only on paperio.site does the engine set
            // Player.prototype.moveTo = true. Without it, every movement step of a player outside
            // its base has a 1-in-2000 chance to mark it as back inside. The trail then never
            // closes, so the territory never grows, and recoverTail is switched off as well. The
            // flag lives on a class neither engine exposes, so an Object.prototype accessor
            // answers true for the player (isPlayer === true) and undefined for everything else.
            // Its setter makes a plain own property, which is what an assignment would have made.
            (function () {
                if (window.location.host === 'paperio.site') {
                    return;
                }
                Object.defineProperty(Object.prototype, 'moveTo', {
                    configurable: true,
                    get: function () {
                        return this.isPlayer === true ? true : undefined;
                    },
                    set: function (value) {
                        Object.defineProperty(this, 'moveTo', { configurable: true, enumerable: true, value: value, writable: true });
                    }
                });
            })();
        </script>

        <script type="text/javascript">
            // Engine switch. The served engine is the readable reconstruction built from ts/
            // (`npm run build` there writes ts/dist/app2.js). The shipped original app2.js is kept
            // byte for byte and loads instead with ?original in the URL. document.write keeps the
            // engine a parser-inserted script, so it runs in order exactly like a plain <script> tag.
            // A local serve with no ts/ build falls back to the original rather than a blank page.
            (function () {
                var original = 'app2.js';
                var reconstruction = 'ts/dist/app2.js';
                var useOriginal = /[?&]original(?:[=&]|$)/.test(window.location.search);

                function writeEngine(engine, src) {
                    window.paperio2engine = engine;
                    document.write('<script type="text/javascript" src="' + src + '"'
                        + (engine === 'reconstruction' ? ' onerror="paperio2engineFallback()"' : '')
                        + '><\/script>');
                }

                window.paperio2engineFallback = function () {
                    console.warn('The reconstruction ' + reconstruction + ' did not load (run `npm run build` in ts/); falling back to the original ' + original + '.');
                    if (document.readyState === 'loading') {
                        writeEngine('original', original);
                        return;
                    }
                    window.paperio2engine = 'original';
                    var script = document.createElement('script');
                    script.src = original;
                    document.body.appendChild(script);
                };

                if (useOriginal) {
                    writeEngine('original', original);
                } else {
                    writeEngine('reconstruction', reconstruction);
                }
            })();
        </script>
        <script type="text/javascript" src="joystick.js"></script>
        <script type="text/javascript">
            // Installed app: sw.js caches the game so it starts with no network. A page outside a secure context
            // (plain http on a host other than localhost) has no navigator.serviceWorker, and skips it. Registered
            // after load, so it never competes with the engine's own boot.
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('sw.js').catch(function (error) {
                        console.warn('The service worker did not register, so the app will not start offline.', error);
                    });
                });
            }
        </script>
    </body>
</html>
