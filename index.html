<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="theme-color" content="#2d3331" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <title>Paper.io 2 (offline)</title>
        <meta
            name="description"
            content="In Paper.io 2 you fight other players for territory on a sheet of paper."
        />

        <link rel="manifest" href="manifest.json" />
        <link rel="icon" type="image/png" href="assets/images/icon512.png" />
        <link rel="stylesheet" href="assets/fonts/ptsans.css" />
        <link rel="stylesheet" href="style3.css" />
        <link rel="stylesheet" href="joystick.css" />
    </head>

    <body>
        <div id="game"></div>
        <div id="about">
            <div class="modal_box">
                <h1>Paper.io 2 online game</h1>
                <div class="modal_scroll">
                    <p>
                        Paper.io 2 is a sequel to what might be the most popular mobile game played by
                        people from all around the world.
                    </p>
                </div>
                <p>
                    <a href="#aboutclose" onclick="HideAbout();">Close window</a>
                </p>
            </div>
        </div>

        <script type="text/javascript">
            // Offline shim: the original page relied on an ad network (adinplay / gameads)
            // and analytics (gtag / Yandex.Metrika). Those are stripped here. The game only
            // needs window.ShowPreroll() to exist (app2.js calls it on "Play") and calls
            // window.paperio2api.startGame() to begin. We just start immediately.

            function ShowAbout() {
                var ab = document.getElementById('about');
                ab.style.display = ab.style.display === 'block' ? 'none' : 'block';
            }
            function HideAbout() {
                document.getElementById('about').style.display = 'none';
            }

            function StartGame() {
                HideAbout();
                window.paperio2api.startGame();
            }

            // Called by app2.js when the player presses Play. No ads offline -> start directly.
            window.ShowPreroll = function () {
                StartGame();
            };
        </script>

        <script type="text/javascript">
            // Engine switch. The served engine is the readable reconstruction built from ts/
            // (`npm run build` there writes ts/dist/app2.js). The shipped original app2.js is kept
            // byte for byte and loads instead with ?original in the URL. document.write keeps the
            // engine a parser-inserted script, so it runs in order exactly like a plain <script> tag.
            // A local serve with no ts/ build falls back to the original rather than a blank page.
            (function () {
                var original = 'app2.js';
                var reconstruction = 'ts/dist/app2.js';
                var useOriginal = /[?&]original(?:[=&]|$)/.test(window.location.search);

                function writeEngine(engine, src) {
                    window.paperio2engine = engine;
                    document.write('<script type="text/javascript" src="' + src + '"'
                        + (engine === 'reconstruction' ? ' onerror="paperio2engineFallback()"' : '')
                        + '><\/script>');
                }

                window.paperio2engineFallback = function () {
                    console.warn('The reconstruction ' + reconstruction + ' did not load (run `npm run build` in ts/); falling back to the original ' + original + '.');
                    if (document.readyState === 'loading') {
                        writeEngine('original', original);
                        return;
                    }
                    window.paperio2engine = 'original';
                    var script = document.createElement('script');
                    script.src = original;
                    document.body.appendChild(script);
                };

                if (useOriginal) {
                    writeEngine('original', original);
                } else {
                    writeEngine('reconstruction', reconstruction);
                }
            })();
        </script>
        <script type="text/javascript" src="joystick.js"></script>
    </body>
</html>
